[package]
name = "kimnara-playground-runner"
version = "0.0.2"
edition = "2024"
rust-version = "1.98"
homepage = "https://github.com/hingebase/kimnara-playground"
repository = "https://github.com/hingebase/kimnara-playground/tree/main/packages/kimnara-playground-runner"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kimnara-playground-runner"
path = "src/main.rs"

[dependencies]
rattler_shell = { version = "=0.27.10", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
