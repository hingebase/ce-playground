# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.71.0/schema/manifest/schema.json

[workspace]
name = "kimnara-playground"
channels = ["conda-forge"]
platforms = [
    "linux-64",
    { platform = "osx-64", macos = "10.15" },
    "win-64",
    { platform = "linux-64", cuda = "13" },
    { platform = "win-64", cuda = "13" },
]
preview = ["pixi-build"]
requires-pixi = ">=0.71.0"

[workspace.build-variants]
microarch_level = ["1"]

[workspace.target.linux-64.build-variants]
c_compiler = ["gcc"]
c_compiler_version = ["16.2"]

[workspace.target.osx-64.build-variants]
c_compiler = ["clang"]
c_compiler_version = ["21.1"]

[workspace.target.win-64.build-variants]
c_compiler = ["vs"]
c_compiler_version = ["2026.1"]
c_stdlib = ["vs"]
c_stdlib_version = ["2026.1"]

[environments]
default = ["dummy", "builder"]
node = ["dummy", "node"]
clang = ["dummy", "clang"]
gcc = ["gcc"]
intel = ["intel"]
msvc = ["msvc"]
nb057 = ["dummy", "numba", "nb057", "pyomp-legacy"]
nb058 = ["dummy", "numba", "nb058", "pyomp-legacy"]
nb059 = ["dummy", "numba", "nb059", "pyomp-legacy"]
nb060 = ["dummy", "numba", "nb060", "pyomp-legacy"]
nb061 = ["dummy", "numba", "nb061", "conda", "pyomp"]
nb062 = ["dummy", "numba", "nb062", "conda", "pyomp"]
nb063 = ["numba", "nb063", "conda", "pyomp"]
nb064 = ["numba", "nb064", "conda"]
nb065 = ["numba", "nb065", "conda"]
nb066 = ["numba", "nb066", "conda"]
nb067 = ["numba", "nb067", "conda"]
cuda = ["cuda"]

[feature.conda.dependencies]
conda = ">=25.9.0"

[feature.dummy]
platforms = ["linux-64", "osx-64-macos-10-15", "win-64"]

[feature.cuda]
platforms = ["linux-64-cuda-13", "win-64-cuda-13"]

[feature.cuda.dependencies]
cuda-cudart = "*"
cuda-nvrtc = "*"
cuda-nvvm-tools = "*"

[feature.cuda.target.linux-64.dependencies]
cuda-cudart-dev_linux-64 = "*"

[feature.cuda.target.win-64.dependencies]
# Only Library/lib/x64/cudadevrt.lib can be found by numba
cuda-cudart-dev_win-64 = ">=13.0.48"

[feature.builder]
channels = ["conda-forge", "https://prefix.dev/github-releases"]

[feature.builder.dependencies]
kimnara-playground-builder = { path = "packages/kimnara-playground-builder" }

[feature.builder.target]
linux-64.dependencies.pixi = ">=0.71.0"
osx-64.dependencies.pixi = { version = ">=0.71.0,<0.74.0", channel = "https://prefix.dev/github-releases" }

[feature.builder.target.win-64.dependencies]
m2-coreutils = "*"
m2-findutils = "*"
m2-sed = "*"
m2-which = "*"
pixi = ">=0.71.0"

[feature.builder.tasks._prepare]
cmd = 'pixi i -a --locked && test -f dist.zip && exit 0; echo "$MESSAGE"; exit 1'

[feature.builder.tasks._prepare.env]
GITHUB_ACTIONS = "https://github.com/compiler-explorer/compiler-explorer/actions/workflows/test-and-deploy.yml"
MESSAGE = "Please grab a recent 'dist.zip' from $GITHUB_ACTIONS and place it at '$PIXI_PROJECT_ROOT'."

[feature.builder.tasks._setup]
cmd = "rm -rf compiler-explorer && python -m kimnara_playground_builder"
depends-on = ["_prepare"]
inputs = ["dist.zip", "pixi.lock"]
outputs = [
    "compiler-explorer/discovered-compilers.json",
    "compiler-explorer/etc/config/c.local.properties",
    "compiler-explorer/etc/config/c++.local.properties",
    "compiler-explorer/etc/config/numba.local.properties",
    "compiler-explorer/etc/config/versionFlag.txt",
    "compiler-explorer/release_build",
]

[feature.node.tasks.start]
cmd = "node app.js --prediscovered discovered-compilers.json"
cwd = "compiler-explorer"
depends-on = ["_setup"]
env = { NODE_ENV = "production" }

[feature.node.target]
linux-64.dependencies.nodejs = "26.*"
osx-64.dependencies.nodejs = "24.*"
win-64.dependencies.nodejs = "26.*"

## C/C++ compilers

[feature.clang.target.linux-64.dependencies]
clangxx_linux-64 = ">=19.1.0"
llvm-tools = ">=19.1.0"

[feature.clang.target.osx-64.dependencies]
clangxx_osx-64 = ">=19.1.0"

[feature.clang.target.win-64.dependencies]
clangxx = ">=19.1.0"
llvm-tools = "*"
vs_win-64 = ">=2026.1.0"

[feature.gcc]
platforms = ["linux-64", "win-64"]

[feature.gcc.target.linux-64.dependencies]
gxx_linux-64 = ">=14.1.0"

[feature.gcc.target.win-64.dependencies]
gxx_win-64 = ">=14.1.0"

[feature.intel]
platforms = ["linux-64", "win-64"]

[feature.intel.dependencies]
onedpl-devel = "*"

[feature.intel.target.linux-64.dependencies]
dpcpp_linux-64 = ">=2025.0.0"

[feature.intel.target.win-64.dependencies]
dpcpp_win-64 = ">=2025.0.0"
vs_win-64 = ">=2026.1.0"

[feature.msvc]
platforms = ["win-64"]

[feature.msvc.dependencies]
vs_win-64 = ">=2026.1.0"

## Numba

[feature.numba.dependencies]
conda-build = "*"
kimnara-playground-runner = { path = "packages/kimnara-playground-runner" }
libblas = { build = "*_mkl" }
psutil = "*"
scipy = "*"

[feature.nb057]
channels = ["conda-forge", "numba"]
target.linux-64.dependencies.numba = { version = "==0.57.1", channel = "conda-forge" }
target.osx-64.dependencies.numba = { version = "==0.57.1", channel = "numba" }
target.win-64.dependencies.numba = { version = "==0.57.1", channel = "numba" }

[feature.nb058]
channels = ["conda-forge", "numba"]
target.linux-64.dependencies.numba = { version = "==0.58.1", channel = "conda-forge" }
target.osx-64.dependencies.numba = { version = "==0.58.1", channel = "numba" }
target.win-64.dependencies.numba = { version = "==0.58.1", channel = "numba" }

[feature.nb059]
channels = ["conda-forge", "numba"]
target.linux-64.dependencies.numba = { version = "==0.59.1", channel = "conda-forge" }
target.osx-64.dependencies.numba = { version = "==0.59.1", channel = "numba" }
target.win-64.dependencies.numba = { version = "==0.59.1", channel = "numba" }

[feature.nb060]
channels = ["conda-forge", "numba"]
target.linux-64.dependencies.numba = { version = "==0.60.0", channel = "conda-forge" }
target.osx-64.dependencies.numba = { version = "==0.60.0", channel = "numba" }
target.win-64.dependencies.numba = { version = "==0.60.0", channel = "numba" }

[feature.nb061]
dependencies.numba = "==0.61.2"

[feature.nb062]
dependencies.numba = "==0.62.1"

[feature.nb063]
platforms = ["linux-64", "win-64"]
dependencies.numba = "==0.63.1"

[feature.nb064]
platforms = ["linux-64", "win-64"]
dependencies.numba = "==0.64.0"

[feature.nb065]
platforms = ["linux-64", "win-64"]
dependencies.numba = "==0.65.1"

[feature.nb066]
platforms = ["linux-64", "win-64"]
dependencies.numba = "==0.66.0"

[feature.nb067]
platforms = ["linux-64", "win-64"]
dependencies.numba = "0.67.*"

[feature.pyomp]
channels = ["Python-for-HPC"]
target.linux-64.dependencies.pyomp = { version = ">=0.4.0", channel = "Python-for-HPC" }

[feature.pyomp-legacy]
channels = ["conda-forge", "numba", "Python-for-HPC"]

[feature.pyomp-legacy.target.linux-64.dependencies]
conda = { version = ">=25.9.0", channel = "conda-forge" }
llvmlite = { channel = "conda-forge" }
pyomp = { version = ">=0.3.2", channel = "Python-for-HPC" }

[feature.pyomp-legacy.target.osx-64.dependencies]
conda = { version = "<24.9.0", channel = "conda-forge" }
icc_rt = { channel = "numba" }
llvmlite = { channel = "numba" }

[feature.pyomp-legacy.target.win-64.dependencies]
conda = { version = "<24.9.0", channel = "conda-forge" }
intel-cmplr-lib-rt = { channel = "conda-forge" }
llvmlite = { channel = "numba" }
